<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Klypbarber" />
    <title>Klypbarber - Premium Barbershop System</title>
    <link rel="icon" type="image/svg+xml" href="/pwa-192x192.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* Animações globais */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime",
    "lucide-react": "https://esm.sh/lucide-react@0.474.0?external=react",
    "react-router-dom": "https://esm.sh/react-router-dom@7.1.3?external=react,react-dom",
    "react-router": "https://esm.sh/react-router@7.1.3?external=react,react-dom",
    "recharts": "https://esm.sh/recharts@2.15.0?external=react,react-dom",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300 overflow-x-hidden">
    <div id="root">
      <div id="initial-loader" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #111827; color: white; font-family: sans-serif;">
        <div style="width: 40px; height: 40px; border: 4px solid #f59e0b; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <p style="margin-top: 16px; color: #9ca3af; font-family: 'Inter', sans-serif;" id="loader-text">Carregando Klypbarber...</p>
        <div id="loader-error" style="display: none; text-align: center; max-width: 400px; margin-top: 20px; padding: 20px;">
          <h2 style="color: #ef4444; font-size: 1.5rem; margin-bottom: 8px; font-weight: bold;">Falha na Conexão</h2>
          <p style="color: #9ca3af; margin-bottom: 24px; font-size: 0.9rem;">Não foi possível inicializar o aplicativo. Problema ao carregar arquivos, verifique sua conexão com a internet ou se o sistema está offline.</p>
          <button onclick="window.location.reload()" style="background-color: #f59e0b; color: #111827; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background-color 0.2s;">
            Tentar Novamente
          </button>
        </div>
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
        </style>
        <script>
          // O timeout avisa se demorou pra carregar react
          window.fallbackTimer = setTimeout(() => {
            if (document.getElementById('initial-loader')) {
              document.getElementById('loader-error').style.display = 'block';
              document.getElementById('loader-text').style.display = 'none';
              const spinner = document.querySelector('#initial-loader div');
              if(spinner) spinner.style.display = 'none';
            }
          }, 8000);

          // Pega erro de falha no import de modulo pelo chrome devtools
          window.addEventListener('error', function(e) {
            if (e.target.tagName === 'SCRIPT' || (e.message && e.message.includes('fetch'))) {
               if (document.getElementById('initial-loader')) {
                 document.getElementById('loader-error').style.display = 'block';
                 document.getElementById('loader-text').style.display = 'none';
                 const spinner = document.querySelector('#initial-loader div');
                 if(spinner) spinner.style.display = 'none';
               }
            }
          }, true);
        </script>
      </div>
    </div>
    <!-- O src/index.tsx é o ponto de entrada ES6 -->
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>

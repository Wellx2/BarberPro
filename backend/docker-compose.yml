version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: barberpro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "3001:3001"
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://postgres:password123@db:5432/barberpro?schema=public"
      JWT_SECRET: "barberpro-super-secret-2026"

volumes:
  postgres_data:
